[tool.poetry]
name = "Investor"
version = "0.1.0"
description = ""
authors = ["David2261 <bulatnasirov2003@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
djangorestframework = "^3.16"
django-environ = "^0.12"
psycopg2-binary = "^2.9.10"
django-filter = "^25.1"
pillow = "^13.0.0"
mysqlclient = "^2.3.2"
drf-spectacular = "^0.30.0"
djangorestframework-simplejwt = "^5.5.1"
django-cors-headers = "^4.9.0"
nh3 = "^0.3.8"
python-dotenv = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.11"
coverage = "^7.6"
ruff = "^0.17.5"
mypy = "^2.4.1"
django-stubs = "^6.1.2"
bandit = "^1.9.4"
djangorestframework-stubs = "^3.18.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "migrations",
    ".venv",
    "venv",
    "static",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "W",      # Warnings
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "DJ",     # Django rules
    "S",      # Bandit security rules
    "SIM",    # Simplify
    "TC",    # Type checking imports
]

ignore = [
    "DJ001",
    "W191",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main"
]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]

